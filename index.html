<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roadster Hover</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        canvas {
            width: 400px;
            height: 600px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 80px);
            aspect-ratio: 2 / 3;
            border: 2px solid #334155;
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(56, 189, 248, 0.12);
            cursor: pointer;
            touch-action: none;
            -webkit-touch-callout: none;
            display: block;
        }
        .controls-hint {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .controls-hint kbd {
            background: #1e293b;
            color: #f8fafc;
            padding: 2px 7px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            border: 1px solid #475569;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="controls-hint">
            <strong>Hold</strong> <kbd>Space</kbd> / <kbd>↑</kbd> / <strong>Click / Touch</strong> to Fire Cold-Gas Thrusters &middot; <kbd>M</kbd> Mute
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
